[project]
name = "pymediate-example-120-custom-provider"
version = "0.1.0"
description = "Implement the ServiceProvider Protocol yourself, over a Dishka container"
requires-python = ">=3.12"
dependencies = [
    # No PyMediate extra here: this example writes the provider by hand rather than
    # using a built-in integration. Loose lower bound per the examples contract - 0.9.0
    # is the first release with the __getitem__/__contains__ ServiceProvider protocol.
    "pymediate>=0.9.0",
    "dishka>=1.10.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
]

[tool.uv]
# An example is an application, not a distributable package: nothing to build or install.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv.sources]
# Depend on the in-branch pymediate source by default; the release runner strips this
# line in its temp copy and re-pins to the build under test (scripts/run_examples.py).
pymediate = { path = "../..", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.ruff.format]
quote-style = "double"
