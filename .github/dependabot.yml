version: 2
updates:
  - package-ecosystem: "uv"
    # "/" is the library itself; "/examples/*" keeps each example's committed uv.lock
    # tracking the latest third-party dependencies. pymediate itself is the in-branch
    # editable source in every example (not a registry dependency), so Dependabot never
    # bumps it here — only each example's other deps move.
    directories:
      - "/"
      - "/examples/*"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "npm"
    # The docs site's pnpm lockfile. Without this, a vulnerable transitive dep here
    # surfaces for the first time at the release gate (dependency-review on the
    # release PR) — the most expensive moment to learn about it.
    directory: "/docs"
    schedule:
      interval: "weekly"
    # pnpm 11 defaults to a 24h minimumReleaseAge supply-chain check (rejects lockfile
    # entries published too recently). Without a cooldown, Dependabot can bump to a
    # version still inside that window, so docs.yml's frozen-lockfile install fails
    # every time until the package ages out on its own (#141, #143). 3 days clears it
    # with margin.
    cooldown:
      default-days: 3
    groups:
      docs-dependencies:
        patterns:
          - "*"
    # typescript 7 breaks next's `next typegen` (it fails to detect typescript at all,
    # so the generated route types — LayoutProps/PageProps/RouteContext — never get
    # written and tsc fails). Hold at 6.x until next/fumadocs support typescript 7.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
      - "javascript"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
      - "github-actions"
