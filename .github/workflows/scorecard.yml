name: Scorecard

# OpenSSF Scorecard supply-chain security analysis. Results feed the code-scanning
# dashboard and the public Scorecard badge in README.md.
on:
  schedule:
    - cron: "30 4 * * 1" # weekly, Monday 04:30 UTC
  push:
    branches: [main]
  # Re-score when branch protection / ruleset config changes, since Scorecard rates it.
  branch_protection_rule:
  workflow_dispatch:

permissions:
  contents: read

# Only the latest score for a ref matters; superseded rescans can be cancelled safely.
concurrency:
  group: "scorecard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Upload Scorecard SARIF results to GitHub code scanning.
      id-token: write # Publish signed Scorecard results to the OpenSSF API via OIDC.

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes to the OpenSSF REST API so the README badge stays current.
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
