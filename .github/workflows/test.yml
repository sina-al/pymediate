name: Tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "docs/content/**"
      - "README.md"
      - "pyproject.toml"
      - "uv.lock"
      - "tasks.toml"
      - "pytest.ini"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main, stable]
  workflow_dispatch:

concurrency:
  group: "test-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

# Least privilege by default; jobs that need more grant it themselves.
permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      code: ${{ steps.filter.outputs.code }}
      doc-examples: ${{ steps.filter.outputs.doc-examples }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            code:
              - "src/**"
              - "scripts/**"
              - "tests/**"
              - "pyproject.toml"
              - "uv.lock"
              - "tasks.toml"
              - "pytest.ini"
              - ".github/workflows/test.yml"
            doc-examples:
              # The snippets themselves, and everything they are executed against: a rename
              # in src/ is exactly the drift this job exists to catch.
              - "src/**"
              - "docs/content/**"
              - "README.md"
              - "tests/markdown_docs_plugin.py"
              - "pyproject.toml"
              - "uv.lock"
              - "tasks.toml"
              - "pytest.ini"
              - ".github/workflows/test.yml"

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - 3.12
          - 3.13
          - 3.14

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Sync dependencies
        run: |
          uv sync --group test --all-extras

      - name: Test
        run: uv run poe test:cov-xml

  doc-examples:
    # Executes every python fence in docs/content/, README.md, and the public docstrings
    # against the real API. Lives here rather than in docs.yml on purpose: docs.yml is the
    # Node-only carve-out (pnpm, no uv/poe bootstrap), and this is a Python test.
    name: Documentation Examples
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.doc-examples == 'true')
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Sync dependencies
        run: |
          uv sync --group test --all-extras

      - name: Test documentation examples
        run: uv run poe test:docs

  coverage-badge:
    # Stores coverage badge data on the python-coverage-comment-action-data branch
    # (explicitly excluded from the branch-guard ruleset), which the README's shields.io
    # coverage badge reads. PR coverage comments come from pr.yml + coverage-comment.yml,
    # not from this job.
    name: Update Coverage Badge
    runs-on: ubuntu-latest
    needs: [test]
    # !cancelled() is required: on push events the transitive `changes` dependency is
    # skipped, which makes the implicit success() false and would skip this job too.
    if: |
      !cancelled() && needs.test.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # Push updated badge data to the dedicated coverage-data branch.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # py-cov-action pushes the badge data branch via the checkout's stored
          # credentials, so this job (alone) must persist them.
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Sync dependencies
        run: uv sync --group test --all-extras

      - name: Run tests with coverage
        run: uv run poe test:cov-xml

      - name: Save coverage badge data
        uses: py-cov-action/python-coverage-comment-action@50d15ff8768f6d897b04e5a0805bd1a98f7096c4 # v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 95
          MINIMUM_ORANGE: 90

  test-suite:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: [changes, test, doc-examples]
    if: always()
    env:
      TEST_RESULT: ${{ needs.test.result }}
      DOC_EXAMPLES_RESULT: ${{ needs.doc-examples.result }}
    steps:
      - name: Check test result
        run: |
          if [[ "$TEST_RESULT" == "failure" ]]; then
            echo "Test matrix failed"
            exit 1
          fi
          if [[ "$DOC_EXAMPLES_RESULT" == "failure" ]]; then
            echo "Documentation examples failed"
            exit 1
          fi
          echo "Tests passed (or were skipped: no relevant changes)"
