name: Checks

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "examples/**"
      - ".devcontainer/**"
      - "pyproject.toml"
      - "uv.lock"
      - "tasks.toml"
      - "pymediate.code-workspace"
      - "ruff.toml"
      - "mypy.ini"
      - ".github/workflows/**"
      - ".claude/skills/example/**"
      - ".claude/context/**"
      - ".claude/CLAUDE.md"
  pull_request:
    branches: [main, stable]
  workflow_dispatch:

concurrency:
  group: "checks-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

# Least privilege: no job here needs more than repo read.
permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      code: ${{ steps.filter.outputs.code }}
      examples: ${{ steps.filter.outputs.examples }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            code:
              - "src/**"
              - "tests/**"
              - "scripts/**"
              - "pyproject.toml"
              - "uv.lock"
              - "tasks.toml"
              - "ruff.toml"
              - "mypy.ini"
              - ".github/workflows/**"
              - ".claude/context/**"
              - ".claude/CLAUDE.md"
            examples:
              - "src/**"
              - "examples/**"
              - ".devcontainer/**"
              - "scripts/run_examples.py"
              - "tests/test_run_examples.py"
              - "pyproject.toml"
              - "uv.lock"
              - "tasks.toml"
              - "pymediate.code-workspace"
              - ".claude/skills/example/**"
              - ".github/workflows/checks.yml"

  check:
    name: Run Checks
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Sync dependencies
        run: |
          uv sync --only-dev

      - name: Format
        run: |
          uv run poe format:check

      - name: Lint
        run: |
          uv run poe lint --output-format=github

      - name: Type check
        run: |
          uv run poe type

      - name: Context freshness
        # .claude/context/api-signatures.md is generated from src/pymediate/ and imported
        # into CLAUDE.md (loaded into every agent session) — stale signatures silently
        # mislead every future session, so staleness fails CI. Fix: uv run poe context:update.
        run: |
          uv run poe context:check

  examples:
    name: Run Examples
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes]
    if: |
      always() &&
      (github.event_name != 'pull_request' ||
       (github.base_ref == 'main' && needs.changes.outputs.examples == 'true'))

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # hatch-vcs needs the tags to derive a valid wheel version.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Sync runner dependencies
        run: |
          uv sync --only-dev

      - name: Check examples contract
        run: |
          uv run poe examples:test --check-contract

      - name: Check examples repository structure
        run: |
          uv run poe examples:test --check-repository

      - name: Build wheel
        run: |
          uv run poe build

      - name: Test examples against the wheel
        run: |
          uv run poe examples:test --wheel dist/*.whl

  checks-summary:
    name: Checks
    runs-on: ubuntu-latest
    needs: [changes, check, examples]
    if: always()
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      CHECK_RESULT: ${{ needs.check.result }}
      EXAMPLES_RESULT: ${{ needs.examples.result }}
    steps:
      - name: Check result
        run: |
          if [[ "$CHANGES_RESULT" == "failure" || "$CHANGES_RESULT" == "cancelled" || \
                "$CHECK_RESULT" == "failure" || "$CHECK_RESULT" == "cancelled" || \
                "$EXAMPLES_RESULT" == "failure" || "$EXAMPLES_RESULT" == "cancelled" ]]; then
            echo "One or more required checks failed"
            exit 1
          fi
          echo "Checks passed (or were skipped: no relevant changes)"
